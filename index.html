<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Strokes Note Opener</title>
<style>
  :root { --ground:#f5f4fa; --surface:#fff; --ink:#1e1b2e; --muted:#625d78; --accent:#6b4fd8; --accent-ink:#fff; --line:#dedbea; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --ground:#15131d; --surface:#1f1c2b; --ink:#ece9f7; --muted:#a7a1bf; --accent:#9a82f2; --accent-ink:#15131d; --line:#34304a; color-scheme: dark; }
  }
  body { margin:0; background:var(--ground); color:var(--ink); font:16px/1.5 "Segoe UI", system-ui, sans-serif; padding:48px 16px; }
  main { max-width:34rem; margin:0 auto; display:grid; gap:20px; }
  .eyebrow { margin:0; font-size:.8rem; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
  h1 { margin:0; font:600 2rem/1.2 Consolas, "Cascadia Mono", monospace; overflow-wrap:anywhere; }
  .card { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; display:grid; gap:14px; }
  .open { display:block; text-align:center; text-decoration:none; background:var(--accent); color:var(--accent-ink); font-weight:600; padding:14px 20px; border-radius:8px; }
  .open:focus-visible { outline:3px solid var(--ink); outline-offset:2px; }
  [hidden] { display:none !important; }
  p { margin:0; }
  .muted { color:var(--muted); font-size:.95rem; }
  code { font-family:Consolas, monospace; background:var(--ground); padding:1px 6px; border-radius:4px; }
  :root { --ok:#1f8a4c; --ok-ink:#fff; }
  @media (prefers-color-scheme: dark) { :root { --ok:#3fbf73; --ok-ink:#0d1f14; } }
  .ticked { background:var(--ok); color:var(--ok-ink); border-radius:10px; padding:22px 20px; text-align:center; font-weight:700; font-size:1.75rem; animation:pop .35s ease-out; }
  @keyframes pop { from { transform:scale(.9); opacity:0; } to { transform:scale(1); opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .ticked { animation:none; } }
</style>
</head>
<body>
<main>
  <p class="eyebrow">Strokes vault · Daily Notes</p>
  <div id="ticked" class="ticked" role="status" hidden>Ticked off ✓</div>
  <h1 id="note">Opening…</h1>
  <div class="card">
    <a id="open" class="open" href="#">Open in Obsidian</a>
    <p class="muted">If Obsidian doesn't open by itself, click the button. The first time, your browser asks "Open Obsidian?" — tick <b>Always allow</b>.</p>
  </div>
  <div class="card">
    <p class="muted">Still nothing? In Obsidian press <b>Ctrl+O</b>, type <code id="name">the note name</code> and press Enter.</p>
  </div>
</main>
<script>
  // Link formats:
  //   Open a note:   https://<user>.github.io/strokes-notes/#2026-09-01  (or ?d=2026-09-01)
  //   Tick a task:   https://<user>.github.io/strokes-notes/#done/2026-09-01/<URL-encoded task text>
  // Ticking needs the "Advanced URI" community plugin in Obsidian. It swaps "- [ ] <task>" for "- [x] <task>" in that note.
  var VAULT = "Strokes", FOLDER = "Daily Notes";
  var hash = (location.hash || "").slice(1), task = "";
  var done = /^done\/(\d{4}-\d{2}-\d{2})\/(.+)$/.exec(hash);
  var n;
  if (done) { n = done[1]; try { task = decodeURIComponent(done[2]); } catch (e) { task = ""; } }
  else { n = decodeURIComponent(hash) || (new URLSearchParams(location.search).get("d") || ""); }
  var ok = /^\d{4}-\d{2}-\d{2}$/.test(n) && (!done || task.trim() !== "");
  var a = document.getElementById("open");
  if (ok) {
    var uri;
    if (done) {
      uri = "obsidian://adv-uri?vault=" + encodeURIComponent(VAULT) +
            "&filepath=" + encodeURIComponent(FOLDER + "/" + n + ".md") +
            "&search=" + encodeURIComponent("- [ ] " + task) +
            "&replace=" + encodeURIComponent("- [x] " + task);
      document.querySelector(".eyebrow").textContent = "Strokes vault · Ticking off a task in " + n;
      document.getElementById("note").textContent = "✓ " + task;
      document.getElementById("note").style.fontSize = "1.25rem";
      a.textContent = "Tick it off in Obsidian";
    } else {
      uri = "obsidian://open?vault=" + encodeURIComponent(VAULT) + "&file=" + encodeURIComponent(FOLDER + "/" + n);
      document.getElementById("note").textContent = n;
      a.textContent = "Open " + n + " in Obsidian";
    }
    document.getElementById("name").textContent = n;
    a.href = uri;
    // For a tick-off, flash the green confirmation for a second before handing over to Obsidian, so it's actually seen.
    var delay = done ? 1200 : 0;
    if (done) document.getElementById("ticked").hidden = false;
    setTimeout(function () { location.href = uri; }, delay);
    // Close the tab once Obsidian has taken focus (or after a few seconds).
    // Browsers only allow this for tabs opened from a link, like an email; otherwise it does nothing.
    var closeTab = function () { setTimeout(function () { window.close(); }, 300); };
    window.addEventListener("blur", closeTab, { once: true });
    document.addEventListener("visibilitychange", function () { if (document.hidden) closeTab(); }, { once: true });
    setTimeout(function () { window.close(); }, 4000 + delay);
    setTimeout(function () {
      document.querySelector(".card .muted").innerHTML = "Obsidian should now be open — you can close this tab.";
    }, 4500);
  } else {
    document.getElementById("note").textContent = "No note chosen";
    a.hidden = true;
  }
</script>
</body>
</html>
